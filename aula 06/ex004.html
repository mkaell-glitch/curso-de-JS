<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body {
            font: normal 20px arial;
        }
    </style>
</head>
<body>
    
    <script>
        var nome = window.prompt("qual é o seu nome?")
        document.write(`ola, ${nome}! seu nome tem ${nome.length} letras :D <br>`)
        document.write(`seu nome em maiusculo é ${nome.toLocaleUpperCase()}`)
        document.write(`seu nome em maiusculo é ${nome.toLocaleLowerCase()}`)
    </script>
</body>
</html>
