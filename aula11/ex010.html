<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Detran</title>
</head>
<body>
    <h1>sistema de multas</h1>
    velocidade do carro:<input type="number" name="txvel" id="txvel">KM/H
    <input type="button" value="verificar" onclick="calcular()">
    <div id="res"></div>
    <script>
        function calcular() {
            var txtv = window.document.getElementById("txvel")
            var res = window.document.querySelector('div#res')
            var vel = Number(txtv.value)
            res.innerHTML = `sua velocidade do carro e de <strong>${vel}</strong> KM/H`
            if (vel > 60) {
                res.innerHTML += ' ,voce esta multado por limite de velocidade.'
            }
            res.innerHTML += '<p>dirija sempre com cinto de segurança!</p>'
        }
    </script>
</body>
</html>
